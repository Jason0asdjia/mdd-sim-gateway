name: Sync upstream main

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main safely when available
        shell: bash
        run: |
          set -euo pipefail
          # An unavailable, renamed, archived, or deleted upstream is non-fatal:
          # no history in this repository is deleted or rewritten.
          if ! git ls-remote --exit-code https://github.com/MddIdd/mdd-sim-gateway.git refs/heads/main >/dev/null 2>&1; then
            echo "Upstream main is unavailable; retaining this repository unchanged."
            exit 0
          fi

          git remote add upstream https://github.com/MddIdd/mdd-sim-gateway.git
          git fetch --no-tags upstream main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already current."
            exit 0
          fi

          # GitHub's built-in token cannot push changes to workflow files. Keep the
          # fork's workflows authoritative, while importing all other upstream code.
          workflow_backup=$(mktemp -d)
          cp -a .github/workflows/. "$workflow_backup"/
          cleanup() { rm -rf "$workflow_backup"; }
          trap cleanup EXIT

          # Configure the bot identity before creating the merge commit.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-commit upstream/main; then
            # Only workflow conflicts are expected because this repository keeps
            # its own automation. Resolve those in favour of this repository;
            # any source-code conflict still stops without a push.
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [ "${#conflicts[@]}" -gt 0 ] && printf '%s\n' "${conflicts[@]}" | grep -qv '^\.github/workflows/'; then
              echo "Upstream merge has non-workflow conflicts; no commit will be pushed."
              git merge --abort
              exit 1
            fi
            printf 'Keeping local workflow files for: %s\n' "${conflicts[*]}"
            git checkout --ours -- .github/workflows
            git add -A .github/workflows
          fi

          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a "$workflow_backup"/. .github/workflows/
          git add -A .github/workflows
          # The upstream may have no non-workflow changes after the merge. In
          # that case restoring our workflows leaves nothing to commit, which
          # is a successful no-op rather than an error.
          if git diff --cached --quiet; then
            echo "No non-workflow upstream changes to synchronize."
            exit 0
          fi
          git commit --no-edit -m "chore：同步上游 main（保留本仓库工作流）"
          git push origin HEAD:main
