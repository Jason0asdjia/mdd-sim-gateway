name: Sync upstream main

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge upstream main safely when available
        shell: bash
        run: |
          set -euo pipefail
          # An unavailable, renamed, archived, or deleted upstream is non-fatal:
          # no history in this repository is deleted or rewritten.
          if ! git ls-remote --exit-code https://github.com/MddIdd/mdd-sim-gateway.git refs/heads/main >/dev/null 2>&1; then
            echo "Upstream main is unavailable; retaining this repository unchanged."
            exit 0
          fi

          git remote add upstream https://github.com/MddIdd/mdd-sim-gateway.git
          git fetch --no-tags upstream main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse upstream/main)" ]; then
            echo "Already current."
            exit 0
          fi

          # Preserve local commits. A conflict makes the job fail without pushing,
          # so manual review is required rather than risking an incorrect merge.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
